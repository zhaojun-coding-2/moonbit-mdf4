name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify-${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [js, wasm-gc]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.11.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install checksum-pinned private MoonBit SDK
        shell: bash
        run: |
          python .ci/bootstrap.py sdk --sdk-dir "$RUNNER_TEMP/mdf4-moon" --cache-dir "$RUNNER_TEMP/mdf4-downloads"
          echo "MOON_HOME=$RUNNER_TEMP/mdf4-moon" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/mdf4-moon/bin" >> "$GITHUB_PATH"
      - name: Bundle the pinned standard library
        shell: bash
        run: |
          moon -C "$MOON_HOME/lib/core" bundle --warn-list -a --all
          moon -C "$MOON_HOME/lib/core" bundle --warn-list -a --target wasm-gc --quiet
      - name: Prepare checksum-pinned dependency workspaces
        shell: bash
        run: python .ci/bootstrap.py deps --deps-dir "$RUNNER_TEMP/mdf4-dependencies" --cache-dir "$RUNNER_TEMP/mdf4-downloads" --include-native
      - name: Real checks, tests, examples and independent consumers
        shell: bash
        run: python .ci/run_checks.py --target "${{ matrix.target }}" --results "$RUNNER_TEMP/mdf4-results"
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mdf4-${{ matrix.target }}-${{ github.sha }}
          path: ${{ runner.temp }}/mdf4-results
          if-no-files-found: warn
          retention-days: 14
